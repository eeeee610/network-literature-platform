server:
  port: 8080

spring:
  application:
    name: content-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://127.0.0.1:3306/novel_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: root
    password: "${DB_PASSWORD:Root@123456}"
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt-secret: "novel-platform-b-content-dev-secret-key-2026"
  dev-token-enabled: true
