server:
  port: 8080

spring:
  application:
    name: novel-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:novel_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# JWT 配置：生产环境必须通过环境变量 JWT_SECRET 覆盖
jwt:
  secret: ${JWT_SECRET:novel-platform-dev-only-secret-key-2026-change-me-in-production}
  expire-hours: 12

logging:
  level:
    com.novel.platform: info
