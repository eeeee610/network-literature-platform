server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: novel-platform-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33307/novel_platform_it_20261123_01?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai

app:
  jwt:
    secret: ${JWT_SECRET:novel-platform-local-dev-secret-please-change-20261124}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
